frr defaults traditional
hostname edge
log syslog informational
ipv6 forwarding
service integrated-vtysh-config
!
ipv6 route 2001:db8:6501::/48 blackhole
!
! Deny-all export to attacker (AS65099) — attacker must not learn edge routes
!
interface eth1
 ip address 10.0.0.2/30
 ipv6 address 2001:db8:10:2::2/64
exit
!
interface eth2
 ip address 10.0.3.1/30
 ipv6 address 2001:db8:10:4::1/64
exit
!
router bgp 65001
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 no bgp network import-check
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 description upstream-router
 neighbor 10.0.3.2 remote-as 65099
 neighbor 10.0.3.2 description attacker-router
 neighbor 2001:db8:10:2::1 remote-as 65000
 neighbor 2001:db8:10:2::1 description upstream-router-v6
 neighbor 2001:db8:10:4::2 remote-as 65099
 neighbor 2001:db8:10:4::2 description attacker-v6
 !
 address-family ipv4 unicast
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.1 allowas-in 1
  neighbor 10.0.0.1 soft-reconfiguration inbound
  neighbor 10.0.3.2 activate
  neighbor 10.0.3.2 soft-reconfiguration inbound
  neighbor 10.0.3.2 route-map TO-ATTACKER-OUT out
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:6501::/48
  neighbor 2001:db8:10:2::1 activate
  neighbor 2001:db8:10:2::1 soft-reconfiguration inbound
  neighbor 2001:db8:10:4::2 activate
  neighbor 2001:db8:10:4::2 soft-reconfiguration inbound
 exit-address-family
 !
 bmp targets raven
  bmp stats interval 5000
  bmp monitor ipv4 unicast pre-policy
  bmp monitor ipv6 unicast pre-policy
  bmp monitor ipv6 unicast post-policy
  bmp connect 172.20.20.1 port 11019 min-retry 1000 max-retry 5000
 exit
exit
!
route-map TO-ATTACKER-OUT deny 10
exit
!
end
