frr defaults traditional
hostname internet
log syslog informational
ipv6 forwarding
service integrated-vtysh-config
!
ipv6 route 2001:db8:2121::/48 blackhole
!
interface eth1
 ip address 10.0.1.1/30
 ipv6 address 2001:db8:10:1::1/64
exit
!
router bgp 64496
 bgp router-id 10.0.1.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 no bgp network import-check
 neighbor 10.0.1.2 remote-as 65000
 neighbor 10.0.1.2 description upstream-router
 neighbor 2001:db8:10:1::2 remote-as 65000
 neighbor 2001:db8:10:1::2 description upstream-router-v6
 !
 address-family ipv4 unicast
  neighbor 10.0.1.2 activate
  neighbor 10.0.1.2 soft-reconfiguration inbound
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:2121::/48
  neighbor 2001:db8:10:1::2 activate
  neighbor 2001:db8:10:1::2 soft-reconfiguration inbound
 exit-address-family
 !
 bmp targets raven
  bmp stats interval 5000
  bmp monitor ipv4 unicast post-policy
  bmp connect 172.20.20.1 port 11019 min-retry 1000 max-retry 5000
 exit
exit
!
end
