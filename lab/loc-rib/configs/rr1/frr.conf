frr defaults traditional
hostname rr1
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.1.1/30
exit
!
interface eth2
 ip address 10.0.2.1/30
exit
!
interface eth3
 ip address 10.0.12.1/30
exit
!
ip prefix-list REJECTED seq 5 permit 10.99.0.0/24
!
route-map FROM-EXT1 deny 10
 match ip address prefix-list REJECTED
exit
route-map FROM-EXT1 permit 20
exit
!
! The router-id is also the address rr2 peers with, so rr1's Loc-RIB and
! rr2's view of rr1 share one peer address in RAVEN.
router bgp 65000
 bgp router-id 10.0.12.1
 no bgp ebgp-requires-policy
 neighbor 10.0.1.2 remote-as 64510
 neighbor 10.0.2.2 remote-as 64520
 neighbor 10.0.12.2 remote-as 65000
 !
 address-family ipv4 unicast
  neighbor 10.0.1.2 route-map FROM-EXT1 in
  neighbor 10.0.12.2 next-hop-self
 exit-address-family
 !
 bmp targets raven
  bmp monitor ipv4 unicast loc-rib
  bmp connect 172.31.90.10 port 11019 min-retry 1000 max-retry 5000
 exit
exit
!
end
