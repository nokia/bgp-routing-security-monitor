frr defaults traditional
hostname rr2
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.12.2/30
exit
!
router bgp 65000
 bgp router-id 10.0.12.2
 neighbor 10.0.12.1 remote-as 65000
 !
 ! Keeps the Adj-RIB-In, so a new BMP session gets the pre-policy table.
 address-family ipv4 unicast
  neighbor 10.0.12.1 soft-reconfiguration inbound
 exit-address-family
 !
 bmp targets raven
  bmp monitor ipv4 unicast pre-policy
  bmp connect 172.31.90.10 port 11019 min-retry 1000 max-retry 5000
 exit
exit
!
end
