bmp:
  listen: "0.0.0.0:11019"
  # tls:
  #   cert: /etc/raven/bmp.crt
  #   key: /etc/raven/bmp.key
  #   ca: /etc/raven/bmp-ca.crt        # Optional: enables mutual TLS (client cert required)
  #   tls-min-version: "1.2"           # Optional: minimum TLS version — "1.2" (default) or "1.3"

rtr:
  rtr-version: auto
  caches:
    - address: "localhost:3323"
      preference: 1
      transport: tcp
      # tls:
      #   ca: /etc/raven/rtr-ca.crt
      #   cert: /etc/raven/rtr-client.crt
      #   key: /etc/raven/rtr-client.key
      #   tls-min-version: "1.2"       # Optional: minimum TLS version — "1.2" (default) or "1.3"

validation:
  rov: true
  aspa: true
  aspa-default-procedure: upstream

outputs:
  prometheus:
    listen: ":9595"
    path: "/metrics"

logging:
  level: info
  format: json

events:
  rules:
    - name: "alert-origin-invalid"
      trigger:
        type: posture
        postures: ["origin-invalid"]
      cooldown: 60s
      actions:
        - type: log
          level: warn
        - type: webhook
          url: "http://localhost:9999"
          max_attempts: 2
          timeout: 3s
        - type: flowspec
          gobgp_address: "gobgp:50051"
          dry_run: true
          ttl: 5m
          rule_action: drop
          max_rules: 50
          reaper_interval: 30s

    - name: "alert-route-leak"
      trigger:
        type: posture
        postures: ["path-suspect"]
      cooldown: 60s
      actions:
        - type: log
          level: warn
        - type: webhook
          url: "http://localhost:9999"
          max_attempts: 2
          timeout: 3s