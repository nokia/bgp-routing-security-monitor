bmp:
  listen: "0.0.0.0:11019"
  # tls:
  #   cert: /etc/raven/bmp.crt
  #   key: /etc/raven/bmp.key
  #   ca: /etc/raven/bmp-ca.crt        # Optional: enables mutual TLS (client cert required)
  #   tls-min-version: "1.2"           # Optional: minimum TLS version — "1.2" (default) or "1.3"

rtr:
  rtr-version: auto
  caches:
    - address: "localhost:3323"
      preference: 1
      transport: tcp
      # tls:
      #   ca: /etc/raven/rtr-ca.crt
      #   cert: /etc/raven/rtr-client.crt
      #   key: /etc/raven/rtr-client.key
      #   tls-min-version: "1.2"       # Optional: minimum TLS version — "1.2" (default) or "1.3"

validation:
  rov: true
  aspa: true
  aspa-default-procedure: upstream

outputs:
  prometheus:
    listen: ":9595"
    path: "/metrics"

logging:
  level: info
  format: json

# Correlation against third-party routing data. Disabled by default: RAVEN
# makes no outbound calls to these providers unless you opt in here.
#
# When enabled, the Event Engine's `global-correlate` action can query
# RIPEstat's looking-glass for a prefix and compare the globally-observed
# origin ASN(s) against RAVEN's local BMP-observed origin. See the
# commented-out rule at the end of this file.
#
# `raven check global` reads these settings but does not require enabled:
# invoking that command is itself the explicit opt-in.
external:
  ripestat:
    enabled: false
    base-url: "https://stat.ripe.net"
    timeout: 5s
    cache-ttl: 60s              # reuse a per-prefix result for this long
    rate-limit-per-min: 10      # per-instance lookup budget

events:
  rules:
    - name: "alert-origin-invalid"
      trigger:
        type: posture
        postures: ["origin-invalid"]
      cooldown: 60s
      actions:
        - type: log
          level: warn
        - type: webhook
          url: "http://localhost:9999"
          max_attempts: 2
          timeout: 3s
        - type: flowspec
          gobgp_address: "gobgp:50051"
          dry_run: true
          ttl: 5m
          rule_action: drop
          max_rules: 50
          reaper_interval: 30s

    - name: "alert-route-leak"
      trigger:
        type: posture
        postures: ["path-suspect"]
      cooldown: 60s
      actions:
        - type: log
          level: warn
        - type: webhook
          url: "http://localhost:9999"
          max_attempts: 2
          timeout: 3s

    # A router that sends several RIBs (pre-policy, post-policy, loc-rib)
    # fires a rule once per RIB. A compound trigger with a rib trigger keeps
    # the rule to some RIBs.
    #
    # - name: "alert-origin-invalid-loc-rib"
    #   trigger:
    #     type: compound
    #     operator: and
    #     triggers:
    #       - type: posture
    #         postures: ["origin-invalid"]
    #       - type: rib
    #         ribs: ["loc-rib"]
    #   cooldown: 60s
    #   actions:
    #     - type: log
    #       level: warn

    # Global visibility correlation. Requires external.ripestat.enabled: true
    # above; RAVEN refuses to start otherwise rather than silently doing
    # nothing.
    #
    # The global-correlate action runs before the other actions in the same
    # rule and attaches its verdict to them: the webhook payload gains a
    # `global_visibility` field and the log action gains global_* keys. It
    # never runs on the BMP ingest path, and an unreachable RIPEstat degrades
    # to an "inconclusive" verdict rather than failing the rule.
    #
    # - name: "correlate-suspicious-routes"
    #   trigger:
    #     type: posture_change
    #     postures: ["origin-invalid", "path-suspect"]
    #   cooldown: 60s
    #   actions:
    #     - type: global-correlate
    #       cache_ttl: 60s        # optional; defaults to external.ripestat.cache-ttl
    #     - type: log
    #       level: warn
    #     - type: webhook
    #       url: "http://localhost:9999"
    #       max_attempts: 2
    #       timeout: 3s